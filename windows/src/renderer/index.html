<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flits</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M18.5 5 9 18h6l-1.5 9L23 14h-6z" fill="#fff"/></svg>
    <span>Flits</span>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="btn-settings" title="Instellingen" aria-label="Instellingen">
      <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.4-2.5c.05-.33.1-.66.1-1s-.04-.67-.1-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.5 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65a7.3 7.3 0 0 0-1.73 1l-2.5-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.05.33-.1.66-.1 1s.04.67.1 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.6.22l2.5-1c.53.4 1.1.74 1.73 1l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.63-.26 1.2-.6 1.73-1l2.5 1c.23.09.47 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13Z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="me">
      <span class="pulse"></span>
      <div>
        <div class="me-label">Zichtbaar als</div>
        <div class="me-name" id="me-name">…</div>
      </div>
    </div>
    <div class="me-hint" id="me-hint"></div>
  </section>

  <section id="update" class="update hidden" aria-live="polite"></section>

  <section>
    <div class="section-head">
      <h2>Apparaten in de buurt</h2>
      <button class="link" id="btn-add">+ Toevoegen met IP-adres</button>
    </div>
    <div id="devices" class="devices"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Downloaden van internet</h2>
      <button class="link" id="btn-dl-clear">Wissen</button>
    </div>
    <form class="dl-form" id="dl-form">
      <input type="text" id="dl-url" placeholder="Plak hier een link naar een bestand…" aria-label="Link naar een bestand" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Downloaden</button>
    </form>
    <div class="dl-hint">Haalt het bestand in 8 stukken tegelijk binnen en bewaart het in je map Downloads.</div>
    <div id="downloads" class="activity"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Activiteit</h2>
      <div class="head-actions">
        <button class="link" id="btn-open-dir">Ontvangen bestanden openen</button>
        <button class="link" id="btn-clear">Wissen</button>
      </div>
    </div>
    <div id="activity" class="activity"></div>
  </section>
</main>

<div id="drop-overlay" class="drop-overlay hidden"><div><strong>Laat los op een apparaat</strong><span>Sleep de bestanden naar het apparaat waar ze naartoe moeten</span></div></div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="app.js"></script>
</body>
</html>
